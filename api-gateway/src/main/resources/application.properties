spring.cloud.gateway.routes[17].uri=lb://NOTIFICATION-SERVICE
spring.cloud.gateway.routes[17].predicates[0]=Path=/api-docs/notification
spring.cloud.gateway.routes[17].filters[0]=RewritePath=/api-docs/notification,/v3/api-docs

# Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.urls-primary-name=Auth Service
springdoc.swagger-ui.urls[0].name=Auth Service
springdoc.swagger-ui.urls[0].url=/api-docs/auth
springdoc.swagger-ui.urls[1].name=Provider Service
springdoc.swagger-ui.urls[1].url=/api-docs/provider
springdoc.swagger-ui.urls[2].name=Schedule Service
springdoc.swagger-ui.urls[2].url=/api-docs/schedule
springdoc.swagger-ui.urls[3].name=Appointment Service
springdoc.swagger-ui.urls[3].url=/api-docs/appointment
springdoc.swagger-ui.urls[4].name=Payment Service
springdoc.swagger-ui.urls[4].url=/api-docs/payment
springdoc.swagger-ui.urls[5].name=Medical Record Service
springdoc.swagger-ui.urls[5].url=/api-docs/medical-record
springdoc.swagger-ui.urls[6].name=Review Service
springdoc.swagger-ui.urls[6].url=/api-docs/review
springdoc.swagger-ui.urls[7].name=Notification Service
springdoc.swagger-ui.urls[7].url=/api-docs/notification